[project]
name = "kitsu-standalone-app"
version = "0.1.0"
description = "Standalone desktop app for Kitsu: log in, pick a task, read and post comments — no DCC required."
requires-python = ">=3.9"
dependencies = [
    "gazu>=1.2.0",
    "requests>=2.32.0",
    "PySide6>=6.6",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.scripts]
kitsu-standalone-app = "kitsu_standalone_app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitsu_standalone_app*"]
